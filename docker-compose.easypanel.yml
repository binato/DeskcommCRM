# ==============================================================================
# DeskcommCRM — Docker Compose para Easypanel
# ==============================================================================
# Adequado especificamente para rodar no Easypanel (v2.x).
#
# Características de compatibilidade:
# 1. Sem serviço Caddy: o proxy reverso Traefik do próprio Easypanel gerencia
#    as portas 80/443 e os certificados SSL (Let's Encrypt).
# 2. Sem diretivas "ports:" publicando no host: evita qualquer conflito de portas.
# 3. Sem "container_name:" fixo: permite escopo automático do Easypanel.
# 4. Volumes nomeados dedicados para persistir sessões do WhatsApp (waha-data).
# 5. Comunicação interna direta via rede do Easypanel (bragentes_supabase_default).
# 6. Auto-migração via db-migrator: aplica extensões e baseline.sql antes de iniciar o app.
# ==============================================================================

services:
  db-migrator:
    image: postgres:17-alpine
    restart: "no"
    networks:
      - default
      - supabase_net
    volumes:
      - ./:/workspace:ro
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "=== DB-MIGRATOR: Aguardando PostgreSQL em $$SUPABASE_DB_URL ==="
        until pg_isready -d "$$SUPABASE_DB_URL"; do
          echo "Aguardando banco de dados responder..."
          sleep 2
        done
        echo "=== DB-MIGRATOR: PostgreSQL conectado! Habilitando extensões ==="
        psql "$$SUPABASE_DB_URL" -c "CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public;"
        psql "$$SUPABASE_DB_URL" -c "CREATE EXTENSION IF NOT EXISTS citext WITH SCHEMA public;"
        psql "$$SUPABASE_DB_URL" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA public;"
        psql "$$SUPABASE_DB_URL" -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\" WITH SCHEMA public;"
        psql "$$SUPABASE_DB_URL" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public;"
        echo "=== DB-MIGRATOR: Extensões prontas. Aplicando baseline.sql ==="
        psql "$$SUPABASE_DB_URL" -v ON_ERROR_STOP=0 -f /workspace/supabase/baseline.sql
        echo "=== DB-MIGRATOR: Concluído com sucesso! ==="

  app:
    image: ${APP_IMAGE:-ghcr.io/melgarafael/deskcommcrm:stable}
    pull_policy: ${APP_PULL_POLICY:-always}
    restart: unless-stopped
    env_file: .env
    networks:
      - default
      - supabase_net
    environment:
      PORT: "3000"
      EVENT_LOG_WORKER_DRAINS: "true"
      WAHA_API_BASE_URL: "http://waha:3000"
      UPSTASH_REDIS_REST_URL: "http://srh:80"
      UPSTASH_REDIS_REST_TOKEN: ${SRH_TOKEN}
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      srh:
        condition: service_started
      waha:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/melgarafael/deskcomm-worker:stable}
    pull_policy: ${WORKER_PULL_POLICY:-always}
    restart: unless-stopped
    env_file: .env
    networks:
      - default
      - supabase_net
    environment:
      WAHA_API_BASE_URL: "http://waha:3000"
      UPSTASH_REDIS_REST_URL: "http://srh:80"
      UPSTASH_REDIS_REST_TOKEN: ${SRH_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 40s

  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:noweb-arm-2026.7.2}
    restart: unless-stopped
    networks:
      - default
    environment:
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512}"
      WHATSAPP_HOOK_URL: "http://app:3000/api/v1/webhooks/waha"
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,message.reaction,session.status,state.change"
      WHATSAPP_HOOK_HMAC_KEY: "${WAHA_HMAC_SECRET}"
      WHATSAPP_DEFAULT_ENGINE: "${WHATSAPP_DEFAULT_ENGINE:-NOWEB}"
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - default
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    networks:
      - default
    environment:
      SRH_MODE: "env"
      SRH_TOKEN: "${SRH_TOKEN}"
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    image: ${SCHEDULER_IMAGE:-ghcr.io/melgarafael/deskcomm-scheduler:stable}
    pull_policy: ${SCHEDULER_PULL_POLICY:-always}
    restart: unless-stopped
    networks:
      - default
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: "UTC"
      INTERNAL_SECRET: "${INTERNAL_SECRET}"

volumes:
  waha-data:
  waha-media:

networks:
  default:
  supabase_net:
    name: bragentes_supabase_default
    external: true
